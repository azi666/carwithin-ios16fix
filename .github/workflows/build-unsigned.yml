name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    # macos-14 has been retired; macos-latest is required for the job to be scheduled at all
    # (a retired label makes the run fail as "cancelled" with zero steps).
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcodebuild -list -project TDSCarKit.xcodeproj || true
          ls -l App/TDSCarKit.entitlements

      # 官方 IPA 内置了 MFi 身份材料；上游源码仓库为安全考虑排除了它们，
      # 这里直接从官方发布里取回来放进 .app，让产物与原版行为一致。
      - name: Fetch MFi identity from the official IPA
        run: |
          set -e
          curl -sSL -o official.ipa https://github.com/xmz28/CarWithin/releases/download/v1.0.5/CarWithin-1.0.5-unsigned.ipa
          test -s official.ipa
          mkdir -p identity
          unzip -o -j official.ipa "Payload/TDSCarKit.app/certificate.p7b" "Payload/TDSCarKit.app/leaf.cer" "Payload/TDSCarKit.app/private.x963" -d identity
          ls -l identity
          test -f identity/certificate.p7b
          test -f identity/leaf.cer
          test -f identity/private.x963

      - name: Build (unsigned, device)
        run: |
          set +e
          set -o pipefail
          xcodebuild \
            -project TDSCarKit.xcodeproj \
            -scheme TDSCarKit \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            TDS_WIFI_ENTITLEMENTS="App/TDSCarKit.entitlements" \
            TDS_WIFI_NAME_DETECTION=YES \
            build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the compiler diagnostics as annotations so they are readable through
            # the API without downloading the log artifact (blocked on some networks).
            grep -E "error:|fatal error|The project|does not contain" build.log | head -10 | while IFS= read -r line; do
              echo "::error file=build.log::$line"
            done
            exit "$status"
          fi

      - name: Package IPA
        run: |
          set -e
          APP=$(find build/Build/Products -maxdepth 3 -name "TDSCarKit.app" -type d | head -1)
          test -n "$APP"
          BIN=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          test -f "$APP/$BIN"
          cp identity/certificate.p7b identity/leaf.cer identity/private.x963 "$APP/"
          # Stamp every build so the on-device "About" screen identifies which binary is running.
          BUILD_STAMP=$(date +%y%m%d.%H%M)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_STAMP" "$APP/Info.plist"
          # Record the exact commit so a log can be matched to source without guessing.
          /usr/libexec/PlistBuddy -c "Delete :CWBuiltFrom" "$APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CWBuiltFrom string ${GITHUB_SHA:0:7}" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :CWBuiltAt" "$APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CWBuiltAt string $(date -u +%Y-%m-%dT%H:%MZ)" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CWBuiltFrom" "$APP/Info.plist"
          ls -l "$APP"/certificate.p7b "$APP"/leaf.cer "$APP"/private.x963
          # Ad-hoc sign so the Wi-Fi entitlement actually reaches the binary: without it
          # NEHotspotNetwork.fetchCurrent returns nil and the app cannot read the SSID/channel.
          # The entitlements file also carries application-identifier + keychain-access-groups so
          # Keychain keeps working after the re-sign (missing them produced errSecMissingEntitlement).
          codesign -f -s - --entitlements App/TDSCarKit.entitlements "$APP"
          codesign -d --entitlements - "$APP" 2>&1 | head -20 || true
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry ../CarWithin-ios16fix-unsigned.ipa Payload
          cd ..
          ls -lh CarWithin-ios16fix-unsigned.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CarWithin-ios16fix-unsigned
          path: CarWithin-ios16fix-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
